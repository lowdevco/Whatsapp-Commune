<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Xen-commune{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="icon" type="image/x-icon" href="{% static 'img/xencommunegreen.png' %}">
  {% block extra_css %}{% endblock %}
</head>

<body>
  <div id="splashScreen" style="
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;
  background-color: #fff;
  z-index: 9999;
  display: flex;
  justify-content: center;
  align-items: center;">
    <img src="{% static 'img/xencommunegreen.png' %}" alt="Loading..."
      style="width: 150px; animation: spin 2s linear infinite;">
  </div>

  <!-- Include Header -->
  {% include 'includes/header.html' %}

  <!-- Main Content -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- Include Footer -->
  {% include 'includes/footer.html' %}

  <!-- Scripts -->
  <script>
    function submitSettings() {
      alert("Settings saved successfully!");
    }
    window.addEventListener("load", function () {
      const splash = document.getElementById("splashScreen");
      if (splash) splash.style.display = "none";
    });
  </script>

  <script>
    function getCSRFToken() {
      return document.querySelector('[name=csrfmiddlewaretoken]').value;
    }

    
    // Toast notification function
    function showToast(type, message) {
      // Create toast container if it doesn't exist
      let toastContainer = document.getElementById('toast-container');
      if (!toastContainer) {
        toastContainer = document.createElement('div');
        toastContainer.id = 'toast-container';
        toastContainer.style.position = 'fixed';
        toastContainer.style.top = '20px';
        toastContainer.style.right = '20px';
        toastContainer.style.zIndex = '9999';
        document.body.appendChild(toastContainer);
      }

      // Create toast element
      const toast = document.createElement('div');
      toast.className = `toast show align-items-center text-white bg-${type}`;
      toast.style.minWidth = '300px';
      toast.style.marginBottom = '10px';
      toast.setAttribute('role', 'alert');
      toast.setAttribute('aria-live', 'assertive');
      toast.setAttribute('aria-atomic', 'true');

      toast.innerHTML = `
        <div class="d-flex">
            <div class="toast-body">${message}</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    `;

      // Add to container
      toastContainer.appendChild(toast);

      // Auto-remove after 5 seconds
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 5000);

      // Add click handler for close button
      toast.querySelector('.btn-close').addEventListener('click', () => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      });
    }
    function showQRScannerModal() {
      // Implement your modal display logic here
      // This should show the WhatsApp QR code scanning interface
      const modal = new bootstrap.Modal(document.getElementById('qrScannerModal'));
      modal.show();

      // You might want to poll the server to check scan status
      const checkScanStatus = setInterval(async () => {
        const response = await fetch("{% url 'check_scan_status' %}");
        const data = await response.json();

        if (data.scan_completed) {
          clearInterval(checkScanStatus);
          modal.hide();
          document.getElementById('saveAccountBtn').disabled = false;
        }
      }, 3000);
    }
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/script.js' %}"></script>

  {% block extra_js %}{% endblock %}
</body>

</html>
