{% extends "base.html" %}
{% load static %}

{% block content %}

<!-- Back to home button -->
<div class="m-2 d-flex align-items-center justify-content-start">
  <a class="btn btn-outline-success backtohomebtnone" href="{% url 'index' %}">
    <i class="bi bi-arrow-left-square-fill"></i>
  </a>
</div>

<!-- Main Form Container -->
<div class="container addingaccount mt-5 mb-5">
  <h4 class="text-white bg-success p-2 rounded">Settings</h4>

  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-success">{{ message }}</div>
    {% endfor %}
  {% endif %}

  <form id="settingsForm" method="post">
    {% csrf_token %}

    <!-- 1. API Configuration -->
    <div class="form-section">
      <div class="section-title">1. API Configuration</div>
      <div class="mb-3">
        <label class="form-label">Gemini AI API Key</label>
        <input type="password" name="gemini_api_key" class="form-control" value="{{ gemini_api_key|default:'' }}" placeholder="AIzaSy..."/>
        <small class="text-muted">This key is required to use the AI Spintax feature safely.</small>
      </div>
    </div>

    <div class="text-end">
      <button type="reset" class="btn btn-secondary">Cancel</button>
      <button type="submit" class="btn btn-success">Save Settings</button>
    </div>
  </form>
</div>

{% endblock %}
