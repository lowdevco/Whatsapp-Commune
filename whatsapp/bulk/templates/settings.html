{% extends "base.html" %}
{% load static %}

{% block content %}

<!-- Back to home button -->
<div class="m-2 d-flex align-items-center justify-content-start">
  <a class="btn btn-outline-success backtohomebtnone" href="{% url 'index' %}">
    <i class="bi bi-arrow-left-square-fill"></i>
  </a>
</div>

<!-- Main Form Container -->
<div class="container addingaccount mt-5 mb-5">
  <h4 class="text-white bg-success p-2 rounded">Settings</h4>

  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-success">{{ message }}</div>
    {% endfor %}
  {% endif %}

  <form id="settingsForm" method="post">
    {% csrf_token %}

    <!-- 1. Account Settings -->
    <div class="form-section">
      <div class="section-title">1. Account Settings</div>
      <div class="mb-3">
        <label class="form-label">Account Nickname</label>
        <input type="text" name="nickname" class="form-control" placeholder="e.g. Main Account"/>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="activeStatus" name="activeStatus" checked>
        <label class="form-check-label" for="activeStatus">Mark Account as Active</label>
      </div>
    </div>

    <!-- 2. Scheduling -->
    <div class="form-section">
      <div class="section-title">2. Scheduling</div>
      <div class="mb-3">
        <label class="form-label">Send At</label>
        <input type="datetime-local" name="send_at" class="form-control"/>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="repeatSchedule" name="repeatSchedule">
        <label class="form-check-label" for="repeatSchedule">Repeat Daily</label>
      </div>
    </div>

    <!-- 3. Campaign Logs -->
    <div class="form-section">
      <div class="section-title">3. Campaign Logs</div>
      <div class="mb-3">
        <label class="form-label">Enable Logging</label>
        <select class="form-select" name="logging">
          <option value="enabled">Enabled</option>
          <option value="disabled">Disabled</option>
        </select>
      </div>
    </div>

    <!-- 4. Privacy & Security -->
    <div class="form-section mb-5">
      <div class="section-title">4. Privacy & Security</div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="encryption" name="encryption" checked>
        <label class="form-check-label" for="encryption">Encrypt Data</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="backup" name="backup">
        <label class="form-check-label" for="backup">Enable Data Backup</label>
      </div>
    </div>

    <div class="text-end">
      <button type="reset" class="btn btn-secondary">Cancel</button>
      <button type="submit" class="btn btn-success">Save Settings</button>
    </div>
  </form>
</div>

{% endblock %}
