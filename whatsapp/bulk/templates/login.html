{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mt-5" style="max-width: 400px;">
  <h3 class="mb-4 text-center">Login</h3>
  <form method="POST">
    {% csrf_token %}
    {% if form.errors %}
      <div class="alert alert-danger">Invalid username or password.</div>
    {% endif %}
    <div class="mb-3">
      <label for="id_username" class="form-label">Username</label>
      <input type="text" name="username" autofocus required class="form-control" id="id_username">
    </div>
    <div class="mb-3">
      <label for="id_password" class="form-label">Password</label>
      <input type="password" name="password" required class="form-control" id="id_password">
    </div>
    <button type="submit" class="btn btn-success w-100">Login</button>
  </form>
  <a href="{% url 'signup' %}" target="_blank">not logined yet? signup</a>
</div>

{% endblock %}
