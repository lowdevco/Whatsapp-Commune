{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mt-5" style="max-width: 400px;">
  <h3 class="mb-4 text-center">Login</h3>
  <form method="POST">
    {% csrf_token %}
    {% if messages %}
      {% for message in messages %}
        <div class="alert {% if message.tags == 'error' %}alert-danger{% elif message.tags %}alert-{{ message.tags }}{% else %}alert-info{% endif %}">{{ message }}</div>
      {% endfor %}
    {% endif %}
    <div class="mb-3">
      <label for="id_username" class="form-label">Username</label>
      <input type="text" name="username" autofocus required class="form-control" id="id_username">
    </div>
    <div class="mb-3">
      <label for="id_password" class="form-label">Password</label>
      <input type="password" name="password" required class="form-control" id="id_password">
    </div>
    <button type="submit" class="btn btn-success w-100">Login</button>
  </form>
  <div class="text-center mt-3">
    <span class="text-muted">Don't have an account?</span> 
    <a href="{% url 'signup' %}" class="text-success fw-bold text-decoration-underline">Create new Account</a>
  </div>
</div>

{% endblock %}
