{% load static %}

<section class="footersection mt-auto" style="margin-top: 100px !important;">
  <!-- Footer Section -->
  <footer class="footerarea">
    <!-- Wave SVG -->
    <div class="wave-container">
      <svg viewBox="0 0 1440 150" preserveAspectRatio="none" class="wave-svg">
        <path d="M0,0 C460,250 1203,0 1440,10 L1440,250 L0,150 Z" fill="#198754"></path>
      </svg>
    </div>

    <!-- Footer Content -->
    <div class="footer-content">
      <img class="footerlogo" src="{% static 'img/whatsappcommune.png' %}" alt="logo">
      <p>©2026 WhatsApp Commune. All rights reserved.</p>
    </div>
  </footer>
</section>

<!-- Footer JavaScript -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const deleteButtons = document.querySelectorAll(".delete-account-btn");

    deleteButtons.forEach(button => {
      button.addEventListener("click", function (e) {
        const form = button.closest(".delete-account-form");
        
        Swal.fire({
          title: "Are you sure?",
          text: "You won't be able to revert this!",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#d33",
          cancelButtonColor: "#6c757d",
          confirmButtonText: "Yes, delete it!",
          customClass: {
            confirmButton: 'rounded-0',
            cancelButton: 'rounded-0',
            popup: 'rounded-0'
          }
        }).then((result) => {
          if (result.isConfirmed) {
            form.submit();
          }
        });
      });
    });

    const logoutBtn = document.querySelector(".logout-btn");
    if (logoutBtn) {
      logoutBtn.addEventListener("click", function (e) {
        Swal.fire({
          title: "Ready to leave?",
          text: "Are you sure you want to log out?",
          icon: "question",
          showCancelButton: true,
          confirmButtonColor: "#d33",
          cancelButtonColor: "#6c757d",
          confirmButtonText: "Yes, log out",
          customClass: {
            confirmButton: 'rounded-0',
            cancelButton: 'rounded-0',
            popup: 'rounded-0'
          }
        }).then((result) => {
          if (result.isConfirmed) {
            document.getElementById('logout-form').submit();
          }
        });
      });
    }

    // Country codes functionality
    const countryCodes = [
      { "name": "India", "dial_code": "+91" },
      { "name": "United States", "dial_code": "+1" },
      { "name": "United Kingdom", "dial_code": "+44" },
      { "name": "UAE", "dial_code": "+971" },
      { "name": "Australia", "dial_code": "+61" },
      { "name": "Germany", "dial_code": "+49" },
      { "name": "France", "dial_code": "+33" },
      { "name": "Japan", "dial_code": "+81" },
      { "name": "Canada", "dial_code": "+1" },
      { "name": "Singapore", "dial_code": "+65" },
    ];

    const select = document.getElementById("countryCode");
    if (select) {
      countryCodes.forEach(country => {
        const option = document.createElement("option");
        option.value = country.dial_code;
        option.text = `${country.name} (${country.dial_code})`;
        select.appendChild(option);
      });
    }
  });
</script>
